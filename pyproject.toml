[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kekmaxxing-mcp"
version = "0.4.1"
description = "Guarded MCP and CLI toolkit for reproducible public-source accountability research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kekmaxxing contributors" }]
keywords = ["mcp", "osint", "campaign-finance", "political-ads", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dnspython>=2.6,<3",
  "httpx>=0.27,<1",
  "httpcore>=1.0,<2",
  "mcp>=1.12,<2",
  "pypdf>=6,<7",
  "remotezip>=0.12,<1",
  "networkx>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
semantic = ["sentence-transformers>=3,<6"]
columnar = ["pyarrow>=18,<24"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
kekmaxxing-mcp = "kekmaxxing_mcp.server:main"
kekmaxxing-google-ads = "kekmaxxing_mcp.google_ads:main"
kekmaxxing-meta-ads = "kekmaxxing_mcp.meta_ads_public:main"
kekmaxxing-ad-archives = "kekmaxxing_mcp.public_ad_archives:main"
kekmaxxing-fec = "kekmaxxing_mcp.fec:main"
kekmaxxing-fcc = "kekmaxxing_mcp.fcc:main"
kekmaxxing-procurement = "kekmaxxing_mcp.procurement:main"
kekmaxxing-wordpress = "kekmaxxing_mcp.wordpress:main"
kekmaxxing-timeline = "kekmaxxing_mcp.timeline:main"
kekmaxxing-x = "kekmaxxing_mcp.x_public:main"
kekmaxxing-citation-audit = "kekmaxxing_mcp.citation_audit:main"
kekmaxxing-telegram-history = "kekmaxxing_mcp.telegram_public:main"
kekmaxxing-pdf = "kekmaxxing_mcp.pdf_public:main"
kekmaxxing-certua = "kekmaxxing_mcp.certua_public:main"
kekmaxxing-site-manifest = "kekmaxxing_mcp.site_manifest:main"
kekmaxxing-content-factory = "kekmaxxing_mcp.content_factory:main"
kekmaxxing-snapshot-delta = "kekmaxxing_mcp.snapshot_delta:main"
kekmaxxing-rdap = "kekmaxxing_mcp.rdap_public:main"
kekmaxxing-tse-accounts = "kekmaxxing_mcp.tse_accounts:main"
kekmaxxing-ad-evidence = "kekmaxxing_mcp.ad_evidence:main"
kekmaxxing-ad-fingerprint = "kekmaxxing_mcp.ad_pattern_fingerprint:main"
kekmaxxing-scan-archive = "kekmaxxing_mcp.public_scan_archives:main"
kekmaxxing-scan-result = "kekmaxxing_mcp.public_scan_results:main"
kekmaxxing-install-browser = "kekmaxxing_mcp.install_browser:main"
kekmaxxing-investigate = "kekmaxxing_mcp.investigate:main"
kekmaxxing-xor-config = "kekmaxxing_mcp.xor_config:main"
kekmaxxing-inline-loader = "kekmaxxing_mcp.inline_loader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kekmaxxing_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kekmaxxing_mcp/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in public network checks", "performance: bounded synthetic performance checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


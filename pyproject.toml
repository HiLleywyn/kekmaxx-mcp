[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kekmaxx-mcp"
version = "0.5.0"
description = "Guarded MCP and CLI toolkit for reproducible public-source accountability research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kekmaxx contributors" }]
keywords = ["mcp", "osint", "campaign-finance", "political-ads", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dnspython>=2.6,<3",
  "httpx>=0.27,<1",
  "httpcore>=1.0,<2",
  "mcp>=1.12,<2",
  "pypdf>=6,<7",
  "remotezip>=0.12,<1",
  "networkx>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
semantic = ["sentence-transformers>=3,<6"]
columnar = ["pyarrow>=18,<24"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
kekmaxx-mcp = "kekmaxx_mcp.server:main"
kekmaxx-google-ads = "kekmaxx_mcp.google_ads:main"
kekmaxx-meta-ads = "kekmaxx_mcp.meta_ads_public:main"
kekmaxx-ad-archives = "kekmaxx_mcp.public_ad_archives:main"
kekmaxx-fec = "kekmaxx_mcp.fec:main"
kekmaxx-fcc = "kekmaxx_mcp.fcc:main"
kekmaxx-procurement = "kekmaxx_mcp.procurement:main"
kekmaxx-wordpress = "kekmaxx_mcp.wordpress:main"
kekmaxx-timeline = "kekmaxx_mcp.timeline:main"
kekmaxx-x = "kekmaxx_mcp.x_public:main"
kekmaxx-citation-audit = "kekmaxx_mcp.citation_audit:main"
kekmaxx-telegram-history = "kekmaxx_mcp.telegram_public:main"
kekmaxx-pdf = "kekmaxx_mcp.pdf_public:main"
kekmaxx-certua = "kekmaxx_mcp.certua_public:main"
kekmaxx-site-manifest = "kekmaxx_mcp.site_manifest:main"
kekmaxx-content-factory = "kekmaxx_mcp.content_factory:main"
kekmaxx-snapshot-delta = "kekmaxx_mcp.snapshot_delta:main"
kekmaxx-rdap = "kekmaxx_mcp.rdap_public:main"
kekmaxx-tse-accounts = "kekmaxx_mcp.tse_accounts:main"
kekmaxx-ad-evidence = "kekmaxx_mcp.ad_evidence:main"
kekmaxx-ad-fingerprint = "kekmaxx_mcp.ad_pattern_fingerprint:main"
kekmaxx-scan-archive = "kekmaxx_mcp.public_scan_archives:main"
kekmaxx-scan-result = "kekmaxx_mcp.public_scan_results:main"
kekmaxx-install-browser = "kekmaxx_mcp.install_browser:main"
kekmaxx-investigate = "kekmaxx_mcp.investigate:main"
kekmaxx-xor-config = "kekmaxx_mcp.xor_config:main"
kekmaxx-inline-loader = "kekmaxx_mcp.inline_loader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kekmaxx_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kekmaxx_mcp/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in public network checks", "performance: bounded synthetic performance checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kekmaxxing-mcp"
version = "0.1.0"
description = "Guarded MCP and CLI toolkit for reproducible public-source accountability research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kekmaxxing contributors" }]
keywords = ["mcp", "osint", "campaign-finance", "political-ads", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dnspython>=2.6,<3",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "remotezip>=0.12,<1",
  "undetected-chromedriver==3.5.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
kekmaxxing-mcp = "kekmaxxing_mcp.server:main"
kekmaxxing-google-ads = "kekmaxxing_mcp.google_ads:main"
kekmaxxing-fec = "kekmaxxing_mcp.fec:main"
kekmaxxing-fcc = "kekmaxxing_mcp.fcc:main"
kekmaxxing-procurement = "kekmaxxing_mcp.procurement:main"
kekmaxxing-wordpress = "kekmaxxing_mcp.wordpress:main"
kekmaxxing-timeline = "kekmaxxing_mcp.timeline:main"
kekmaxxing-x = "kekmaxxing_mcp.x_public:main"
kekmaxxing-citation-audit = "kekmaxxing_mcp.citation_audit:main"
kekmaxxing-install-browser = "kekmaxxing_mcp.install_browser:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kekmaxxing_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

